# MangoWM configuration
# Only values that differ from /etc/mango/config.conf appear here.
# Reference: /etc/mango/config.conf, ~/projects/mango

# --- Autostart -------------------------------------------------------------



# --- Monitors --------------------------------------------------------------

monitorrule=name:^DP-2$,width:3440,height:1440,x:0,y:0,scale:1.0,vrr:0,rr:0
monitorrule=name:^eDP-1$,width:2880,height:1920,refresh:120,x:1000,y:1440,scale:2.0,vrr:0,rr:0

# --- Appearance ------------------------------------------------------------

animations=0
layer_animations=0
border_radius=6
borderpx=3
gappoh=3
gappov=3
cursor_size=14

# Catppuccin Mocha
rootcolor=0x373d49ff
bordercolor=0x00000000
focuscolor=0xcba6f7ff
urgentcolor=0xf38ba8ff

# --- Layout ----------------------------------------------------------------

scroller_proportion_preset=0.33,0.5,0.8,1.0

tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller

# --- Input -----------------------------------------------------------------

mouse_natural_scrolling=1

# --- Keybindings: apps -----------------------------------------------------

bind=SUPER,space,spawn,fuzzel
bind=SUPER,t,spawn,kitty
bind=SUPER,l,spawn,hyprlock

# --- Keybindings: session --------------------------------------------------

bind=SUPER,r,reload_config
bind=SUPER,q,killclient
bind=SUPER,Escape,quit

# --- Keybindings: focus ----------------------------------------------------

bind=SUPER,Tab,focusstack,next
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,prev
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# --- Keybindings: move within stack ----------------------------------------

bind=SUPER+ALT,Left,exchange_client,left
bind=SUPER+ALT,Right,exchange_client,right
bind=SUPER+ALT,Up,exchange_client,up
bind=SUPER+ALT,Down,exchange_client,down

# --- Keybindings: window state ---------------------------------------------

bind=SUPER,m,togglemaximizescreen
bind=SUPER,f,togglefloating
bind=SUPER,g,togglegaps
bind=SUPER,o,toggleoverview

# --- Keybindings: layout and scroller --------------------------------------

bind=SUPER,n,switch_layout
bind=SUPER,x,switch_proportion_preset
bind=SUPER,backslash,set_proportion,1.0
bind=SUPER+ALT+CTRL,Left,scroller_stack,left
bind=SUPER+ALT+CTRL,Right,scroller_stack,right
bind=SUPER+ALT+CTRL,Up,scroller_stack,up
bind=SUPER+ALT+CTRL,Down,scroller_stack,down

# --- Keybindings: tags -----------------------------------------------------

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# --- Keybindings: monitors -------------------------------------------------

bind=ALT+SHIFT,Left,focusmon,left
bind=ALT+SHIFT,Right,focusmon,right
bind=SUPER+SHIFT,Left,tagmon,left
bind=SUPER+SHIFT,Right,tagmon,right

# --- Keybindings: gaps -----------------------------------------------------

bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1

# --- Keybindings: hardware -------------------------------------------------

bind=NONE,XF86MonBrightnessUp,spawn,brillo -A 5
bind=NONE,XF86MonBrightnessDown,spawn,brillo -m 5
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# --- Mouse -----------------------------------------------------------------

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
