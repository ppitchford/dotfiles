general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = pidof hyprlock || hyprlock
}

listener {
    timeout = 120
    on-timeout = pidof hyprlock || hyprlock
}

listener {
    timeout = 300
    on-timeout = mmsg -d disable_monitor,eDP-1
    on-resume = mmsg -d enable_monitor,eDP-1
}

listener {
    timeout = 900
    on-timeout = poweroff
}
