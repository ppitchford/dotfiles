auth {
    fingerprint {
        enabled = true
        ready_message = Place your finger on the reader
        present_message = Scanning...
    }
}

background {
    monitor =
    path = ~/Pictures/wallpapers/junji-ito-dark.png
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    outer_color = rgb(e0def4)
    inner_color = rgb(191724)
    font_color = rgb(e0def4)
    fade_on_empty = true
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(e0def4ff)
    font_size = 48
    font_family = Inter
    position = 0, 100
    halign = center
    valign = center
}
