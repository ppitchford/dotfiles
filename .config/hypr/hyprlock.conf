auth {
    fingerprint {
        enabled = true
        ready_message = Place your finger on the reader
        present_message = Scanning...
    }
}

background {
    monitor =
    path = ~/Pictures/wallpapers/wallpaper-1-3840.jpg
}
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3
    outer_color = rgb(a093c7)
    inner_color = rgb(161821)
    font_color = rgb(c6c8d1)
    fade_on_empty = true
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(c6c8d1ff)
    font_size = 48
    font_family = Inter
    position = 0, 100
    halign = center
    valign = center
}
