auth {
    fingerprint {
        enabled = true
        ready_message = Place your finger on the reader
        present_message = Scanning...
    }
}

# Solid black rather than an image: the desktop is flat black, and a path
# here would re-couple the lock screen to a wallpaper file that no longer
# exists in the session. Like waybar, this file is outside the theme bundle
# and does not follow the solar switch.
background {
    monitor =
    color = rgb(000000)
}
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3
    outer_color = rgb(669961)
    inner_color = rgb(000000)
    font_color = rgb(c7c5c2)
    fade_on_empty = true
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(c7c5c2ff)
    font_size = 48
    font_family = Inter
    position = 0, 100
    halign = center
    valign = center
}
